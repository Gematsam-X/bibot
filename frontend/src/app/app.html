<h1>Bibot 🤖</h1>

<div class="chat">
	@for (msg of msgs; track $index) {
		<div
			class="messaggio"
			[class.user]="msg.role === 'user'"
			[class.assistant]="msg.role === 'bibot'"
		>
			<strong>
				{{ msg.role === 'user' ? 'Tu' : 'Bibot' }}
			</strong>

			<p>{{ msg.content }}</p>
		</div>
	}
</div>

<div class="input-container">
	<input
		type="text"
		[(ngModel)]="msg"
		placeholder="Scrivi un messaggio..."
		(keydown.enter)="inviaMessaggio()"
	/>

	<button (click)="inviaMessaggio()">
		Invia
	</button>
</div>
