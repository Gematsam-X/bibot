@for (msg of msgs; track $index) {
  <div
    class="message-row"
    [class.user]="msg.role === 'user'"
    [class.assistant]="msg.role === 'bibot'"
  >
    <div class="message-bubble">
      <div class="message-author">
        {{ msg.role === 'user' ? 'Tu' : 'Bibot' }}
      </div>

      <div class="message-content">
        {{ msg.content }}
      </div>
    </div>
  </div>
}
