<div class="input-container">
  <input
    type="text"
    [(ngModel)]="msg"
    placeholder="Scrivi un messaggio..."
    (keydown.enter)="triggerSendMessage()"
  />

  @if (sttService.isRecording()) {
    <div class="recording-controls">
      <button
        type="button"
        class="cancel-recording-button"
        (click)="cancelRecording()"
        title="Annulla registrazione"
      >
        <fa-icon [icon]="cancelIcon"></fa-icon>
      </button>

      <button
        type="button"
        class="stop-recording-button"
        (click)="toggleRecording()"
        title="Termina registrazione"
      >
        <fa-icon [icon]="stopIcon"></fa-icon>
      </button>
    </div>
  } @else {
    <button
      type="button"
      class="microphone-button"
      (click)="toggleRecording()"
      [disabled]="sttService.isTranscribing()"
      title="Registra messaggio"
    >
      @if (sttService.isTranscribing()) {
        <span class="transcribing-icon">
          <fa-icon [icon]="micIcon"></fa-icon>
        </span>
      } @else {
        <fa-icon [icon]="micIcon"></fa-icon>
      }
    </button>
  }

  <div class="docs-dropdown">
    <button type="button" class="docs-button" (click)="docsOpen = !docsOpen">
      <span>Documenti</span>

      <span class="docs-arrow" [class.open]="docsOpen"> ▾ </span>
    </button>

    @if (docsOpen) {
      <div class="docs-menu">
        <button type="button" class="select-all-button" (click)="selectAllDocs()">
          Seleziona tutto
        </button>

        @if (availableDocs.includes("bible")) {
          <label class="doc-option doc-standalone">
            <input
              type="checkbox"
              [checked]="useTheseDocs.includes('bible')"
              [disabled]="useTheseDocs.length === 1 && useTheseDocs.includes('bible')"
              (change)="toggleDoc('bible')"
            />

            <span>{{ getDocLabel("bible") }}</span>
          </label>
        }

        @if (availableDocs.includes("publications")) {
          <label class="doc-option doc-parent">
            <input
              type="checkbox"
              [checked]="useTheseDocs.includes('publications')"
              [disabled]="isPublicationsLocked()"
              (change)="toggleDoc('publications')"
            />

            <span>{{ getDocLabel("publications") }}</span>
          </label>

          <div class="doc-children">
            @for (doc of availableDocs; track doc) {
              @if (doc !== "publications" && doc !== "bible") {
                <label class="doc-option doc-child">
                  <input
                    type="checkbox"
                    [checked]="useTheseDocs.includes(doc)"
                    [disabled]="useTheseDocs.length === 1 && useTheseDocs.includes(doc)"
                    (change)="toggleDoc(doc)"
                  />

                  <span>{{ getDocLabel(doc) }}</span>
                </label>
              }
            }
          </div>
        }
      </div>
    }
  </div>

  <button type="button" class="send-button" (click)="triggerSendMessage()">Invia</button>
</div>
